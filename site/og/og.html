<!doctype html>
<!--
  Source of public/og.png, the 1200x630 share image (og:image).
  Render it again after a change, from site/:
    chromium --headless --disable-gpu --hide-scrollbars --force-device-scale-factor=1 \
      --window-size=1200,630 --screenshot=public/og.png og/og.html
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: "Inter"; src: url("../public/fonts/Inter-latin.woff2") format("woff2"); font-weight: 100 900; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(ellipse 60% 55% at 50% 32%, rgb(127 180 255 / 10%), transparent 70%), #000;
    color: #f5f5f7; font-family: "Inter", sans-serif; text-align: center;
    -webkit-font-smoothing: antialiased;
  }
  img { width: 160px; height: 160px; margin-bottom: 48px; filter: drop-shadow(0 16px 44px rgb(127 180 255 / 22%)); }
  h1 { margin: 0; max-width: 1100px; font-size: 68px; white-space: nowrap; font-weight: 700; line-height: 1.08; letter-spacing: -0.022em; text-wrap: balance; }
</style>
</head>
<body>
  <img src="../public/icons/icon-512.png" alt="" />
  <h1>Talk to your agents.<br />Your voice stays on your Mac.</h1>
</body>
</html>
